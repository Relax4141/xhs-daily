const START = EMBEDDED.startDate;
let POSTS = [], TODAY = null;

const dayKey = d => d.toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);

function pickPost(dateStr){
  const idx = Math.abs(daysBetween(START, dateStr)) % POSTS.length;
  return POSTS[idx];
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"), 1600);
}

function render(selTitleIndex){
  const p = TODAY;
  document.getElementById("todayLabel").textContent = dayKey(new Date());
  document.getElementById("cover").src = p.img;
  document.getElementById("cover").onerror = function(){
    this.onerror = null;
    this.src = ["./images/fallback/1.jpg","./images/fallback/2.jpg","./images/fallback/3.jpg"][new Date().getDate() % 3];
  };
  const ei = document.getElementById("extraImgs");
  ei.innerHTML = "";
  (p.images || []).slice(1).forEach(function(src){
    const im = document.createElement("img");
    im.className = "cover"; im.src = src; im.style.marginTop = "12px";
    im.onclick = function(){ window.open(src, "_blank"); };
    im.onerror = function(){ im.remove(); };
    ei.appendChild(im);
  });
  document.getElementById("theme").textContent = "主题：" + p.theme;
  document.getElementById("body").textContent = p.body;
  document.getElementById("postTime").textContent = p.postTime;
  document.getElementById("tags").innerHTML = p.tags.map(t=>`<span class="tag">${t}</span>`).join("");
  document.getElementById("theme").textContent = "主题：" + p.theme + (p.column ? "　｜　栏目：" + p.column : "");
  document.getElementById("basis").textContent = p.basis ? "📌 依据：" + p.basis : "";
  const aw = document.getElementById("altWrap");
  if(p.alt){
    aw.style.display = "";
    document.getElementById("altTheme").textContent = "备选笔记 · " + p.alt.theme;
    document.getElementById("altBody").textContent = p.alt.body;
    document.getElementById("altTags").innerHTML = p.alt.tags.map(t=>`<span class="tag">${t}</span>`).join("");
  } else { aw.style.display = "none"; }
  const tw = document.getElementById("titles");
  tw.innerHTML = "";
  p.titles.forEach((t,i)=>{
    const el = document.createElement("div");
    el.className = "title-opt" + ((selTitleIndex||0)===i?" sel":"");
    el.textContent = "标题 " + (i+1) + "：" + t;
    el.onclick = ()=>{
      [...tw.children].forEach(c=>c.classList.remove("sel"));
      el.classList.add("sel");
      window.__selTitle = t;
    };
    tw.appendChild(el);
  });
  window.__selTitle = p.titles[0];
}

function altText(){
  const a = TODAY && TODAY.alt;
  if(!a) return "";
  return `${a.titles[0]}\n\n${a.body}\n\n${a.tags.join(" ")}\n\n（评论区扣【${a.keyword}】领完整步骤）`;
}

function fullText(){
  const p = TODAY;
  return `${window.__selTitle || p.titles[0]}\n\n${p.body}\n\n${p.tags.join(" ")}\n\n（评论区扣【${p.keyword}】领完整步骤）`;
}

function copyText(txt, okMsg){
  const done = ()=>toast(okMsg||"已复制");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  } else fallback(txt,done);
}
function fallback(txt,done){
  const ta=document.createElement("textarea");ta.value=txt;
  ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);
  ta.select();try{document.execCommand("copy");done()}catch(e){toast("复制失败，请手动选择")}
  document.body.removeChild(ta);
}

  render(0);
  // history: 从 startDate 到今天
  const total = Math.max(0, daysBetween(START, today));
  const rows = [];
  for(let i=total;i>=0;i--){
    const d = new Date(Date.parse(START)+i*86400000);
    const k = dayKey(d);
    const hit = (SCH && SCH.days) ? SCH.days.filter(function(x){ return x.date === k; })[0] : null;
    const p = hit || pickPost(k);
    const tag = hit ? "" : "（池）";
    rows.push(`<div class="hist"><span>${k}</span>${p.theme}${tag}　·　${p.titles[0]}</div>`);
  }
  document.getElementById("history").innerHTML = rows.join("") || '<div class="hint">暂无记录</div>';

  document.getElementById("copyBtn").onclick = ()=>copyText(fullText());
  document.getElementById("copyAlt").onclick = ()=>copyText(altText(), "备选文案已复制");
  document.getElementById("copyCover").onclick = ()=>{ if(TODAY.img) window.open(TODAY.img, "_blank"); };
}).catch(()=>{
  document.getElementById("statusBadge").textContent = "内容加载失败";
  document.getElementById("history").innerHTML = '<div class="hint">内容池加载失败，请刷新</div>';
});
</script>
</body>
</html>
